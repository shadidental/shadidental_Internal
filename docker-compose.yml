# For the clinic's own server at go-live (app + PostgreSQL on one machine).
# For Supabase testing you don't need this: run `npm run dev` with .env pointing at Supabase.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://portal:${POSTGRES_PASSWORD}@db:5432/portal
      DIRECT_URL: postgresql://portal:${POSTGRES_PASSWORD}@db:5432/portal
    ports: ["127.0.0.1:3000:3000"]   # put a reverse proxy with HTTPS in front
    depends_on: [db]
volumes:
  pgdata:
